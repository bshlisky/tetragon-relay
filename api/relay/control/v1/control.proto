// Control protocol between the relay agent and the controller stream
// gateway, architecture doc section 6.2, transcribed as exactly as section
// 6.2 specifies, amended per the step 1 architect review (see ADR 0010:
// ADR 0005, which covered the messages section 6.2 references but never
// defines, is superseded by this revision). This step only generates the
// message/service stubs; no client or server code is implemented yet (that
// is a later step).
//
// This proto is unreleased: no consumer outside this repository depends on
// it yet, so the step 1 review authorized freely changing field types and
// shapes now. From this commit forward, buf's breaking-change baseline is
// this file; see docs/decisions/0010-proto-breaking-change-baseline.md for
// the baseline commit SHA.
syntax = "proto3";
package relay.control.v1;

option go_package = "github.com/bshlisky/tetragon-relay/api/relay/control/v1;controlv1";

service AgentControl {
  // Exactly one active stream per host identity. A second open from the same
  // SVID terminates the older stream and raises a duplicate-identity alert.
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message AgentMessage {
  uint64 seq = 1;                    // strictly increasing per stream
  oneof body {
    Hello        hello        = 10;
    Heartbeat    heartbeat    = 11;
    ApplyResult  apply_result = 12;
    StateReport  state_report = 13;
    Alert        alert        = 14;
  }
}

message ControllerMessage {
  uint64 seq = 1;
  oneof body {
    HelloAck       hello_ack       = 10;
    PolicyBundle   bundle          = 11;  // opaque signed envelope (Section 7)
    StateRequest   state_request   = 12;  // ask for full StateReport
    RotateIdentity rotate_identity = 13;  // trigger early key rotation
    TrustUpdate    trust_update    = 14;  // signed root metadata (Section 7.6)
    Terminate      terminate       = 15;  // reason code; agent backs off
  }
  // No exec, file write, shell, config-set, or debug messages exist by design.
}

message Hello {
  string host_uuid          = 1;
  string agent_version      = 2;
  string agent_build_digest = 3;  // sha256 of running binary (/proc/self/exe)
  string tetragon_version   = 4;  // from Tetragon GetVersion
  string kernel_release     = 5;
  string boot_id            = 6;  // /proc/sys/kernel/random/boot_id
  // scope -> current epoch. A host may be in more than one scope
  // (architecture doc section 8.6, host.allowed_scopes); a single
  // current_epoch field cannot represent that. Step 1 review A8.
  map<string, uint64> epochs = 7;
  bytes  loaded_digest      = 8;  // see Section 6.4
  bytes  lkg_bundle_digest  = 9;
  bytes  trust_root_digest  = 10;
  uint64 trust_root_version = 11;
  bytes  pcr_quote          = 12; // optional TPM quote over nonce from HelloAck
  bytes  config_digest      = 13; // sha256 of relay.yaml (section 8.5); step 1 review A8
  // "on", "off" or "unknown": whether the running Tetragon collects
  // process environment variables (relay-probe's host fact;
  // step-07b-decisions-3.md F4). "on" also raises
  // Alert{TETRAGON_ENV_COLLECTION} once per connection.
  string tetragon_env_collection = 14;
}

message Heartbeat {
  // scope -> current epoch; see Hello.epochs. Step 1 review A8.
  map<string, uint64> epochs = 1;
  bytes  loaded_digest = 2;
  TetragonHealth health = 3;        // from GetHealth + process liveness
  uint64 telemetry_last_seq = 4;    // last telemetry batch seq shipped
  uint32 telemetry_backlog = 5;     // batches spooled, not acked
}

message ApplyResult {
  bytes  bundle_digest = 1;
  uint64 epoch         = 2;
  // STATUS_UNSPECIFIED is the zero value so that an unset status can never
  // read as success. The controller treats STATUS_UNSPECIFIED and any value
  // it does not know as "not applied" (ADR 0037; review R6B-1). APPLIED was
  // 0 before ADR 0037 and is now 10; numbers 1-9 are unchanged.
  enum Status { STATUS_UNSPECIFIED = 0;
                REJECTED_SIGNATURE = 1; REJECTED_TARGET = 2;
                REJECTED_EPOCH = 3; REJECTED_EXPIRED = 4; REJECTED_SCHEMA = 5;
                REJECTED_GUARDRAIL = 6; APPLY_FAILED = 7; ROLLED_BACK = 8;
                REJECTED_CAPABILITY = 9;
                APPLIED = 10;
                // A pending bundle replaced by a newer one before it was
                // started; never verified (ADR 0036, server-contract 10.2).
                SUPERSEDED = 11;
                // The agent's store is TAMPERED; nothing is applied.
                REJECTED_TAMPERED = 12;
                // Verified, but the agent's state does not allow APPLYING.
                REJECTED_AGENT_STATE = 13;
                // The health window failed and re-asserting LKG also failed.
                ROLLBACK_FAILED = 14;
                // The health window could not prove its observation path
                // current (freshness sentinels late or missing) before its
                // maximum; LKG was re-asserted (ADR 0042).
                ROLLED_BACK_UNVERIFIABLE = 15; }
  Status status = 3;
  string detail = 4;               // bounded 4 KiB, no secrets
  bytes  loaded_digest_after = 5;
}

// --------------------------------------------------------------------------
// The messages below were originally added as minimal placeholders (ADR
// 0005, step 1) because architecture doc section 6.2 references them in the
// oneofs above but never defines their fields. The step 1 architect review
// (Part A, item A8) supersedes ADR 0005 with the concrete shapes below; see
// ADR 0010.
// --------------------------------------------------------------------------

message TetragonHealth {
  bool   serving                    = 1;
  string version                    = 2;
  uint64 process_start_time_unix    = 3;
  uint32 restarts_since_boot        = 4;
  string detail                     = 5;
}

message StateReport {
  bytes nonce = 1;
  // scope -> current epoch; see Hello.epochs.
  map<string, uint64> epochs = 2;
  bytes loaded_digest     = 3;
  bytes lkg_bundle_digest = 4;
  repeated LoadedPolicy policies = 5;
  TetragonHealth health = 6;
}

message LoadedPolicy {
  string name   = 1;
  string state  = 2;
  bool   enabled = 3;
  bytes  canonical_sha256 = 4;
}

message Alert {
  enum Kind {
    KIND_UNSPECIFIED    = 0;
    DRIFT               = 1;
    TETRAGON_UNHEALTHY  = 2;
    TRUST_EXPIRED       = 3;
    TAMPER              = 4;
    GUARDRAIL_REJECT    = 5;
    // A TrustUpdate (or one step of it) was not adopted (ADR 0037).
    TRUST_UPDATE_REJECTED = 6;
    // A health-window rollback could not re-assert LKG (ADR 0037).
    ROLLBACK_FAILED     = 7;
    // A health window ended unverifiable; detail carries the measured
    // sentinel latencies (ADR 0042).
    HEALTH_UNVERIFIABLE = 8;
    // The running Tetragon collects process environment variables
    // (Hello.tetragon_env_collection == "on"); once per connection
    // (step-07b-decisions-3.md F4).
    TETRAGON_ENV_COLLECTION = 9;
  }
  Kind   kind      = 1;
  string detail    = 2; // bounded 4 KiB, no secrets
  int64  unix_time = 3;
}

message HelloAck {
  bytes  nonce                       = 1; // exactly 32 bytes
  uint32 heartbeat_interval_seconds  = 2;
}

message PolicyBundle {
  // Section 7.3: "opaque signed envelope". The raw DSSE bytes are carried
  // unmodified and must never be re-encoded in transit: the agent verifies
  // the signature over exactly these bytes, so even a semantically-neutral
  // re-serialization (e.g. re-marshaling the JSON) could change the bytes
  // being signed over without changing their meaning. envelope must be
  // <= 1 MiB (architecture doc section 7.4 step 1; internal/limits.MaxEnvelopeBytes).
  bytes envelope = 1;
}

message StateRequest {
  bytes nonce = 1;
}

message RotateIdentity {
  string reason = 1;
}

message TrustUpdate {
  // Ordered root metadata versions N+1..M, each to be verified against its
  // immediate predecessor via (*trust.Root).Update before being accepted
  // (architecture doc section 7.6). Carrying the whole chain, not just the
  // latest version, lets an agent that missed several rotations catch up
  // without the controller needing to know which version the agent is
  // currently on. Step 1 review A8.
  repeated bytes signed_roots = 1;
}

message Terminate {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REVOKED            = 1;
    DUPLICATE_SESSION  = 2;
    PROTOCOL_ERROR     = 3;
    SHUTDOWN           = 4;
  }
  Reason reason = 1;
  string detail = 2;
}

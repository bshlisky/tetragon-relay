version: "2"

run:
  timeout: 5m
  build-tags:
    - testtools

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - bodyclose
    - nilerr
    - gosec
    - depguard
  settings:
    # Architecture 10.2 / ADR 0039 section 8: telemetry cannot reach the
    # control path, and the control path cannot reach telemetry. The only
    # shared surface is two narrow interfaces connected in cmd/relayd.
    depguard:
      rules:
        telemetry-isolated:
          files:
            - "**/internal/telemetry/**"
          deny:
            - pkg: github.com/bshlisky/tetragon-relay/internal/apply
              desc: telemetry must not reach apply (architecture 10.2)
            - pkg: github.com/bshlisky/tetragon-relay/internal/verify
              desc: telemetry must not reach verify (architecture 10.2)
            - pkg: github.com/bshlisky/tetragon-relay/internal/guard
              desc: telemetry must not reach guard (architecture 10.2)
            - pkg: github.com/bshlisky/tetragon-relay/internal/trust
              desc: telemetry must not reach trust (architecture 10.2)
            - pkg: github.com/bshlisky/tetragon-relay/internal/controlclient
              desc: telemetry has its own dialer; shared TLS code is internal/spiffetls
            - pkg: github.com/bshlisky/tetragon-relay/internal/agent
              desc: telemetry must not reach the agent (apply worker, control loop)
            - pkg: github.com/bshlisky/tetragon-relay/internal/tetra
              desc: telemetry gets a read-only EventSource, never a client that can write policies
            - pkg: github.com/bshlisky/tetragon-relay/internal/store
              desc: telemetry gets a derived key, never the store
        control-without-telemetry:
          files:
            - "**/internal/apply/**"
            - "**/internal/verify/**"
            - "**/internal/guard/**"
            - "**/internal/trust/**"
            - "**/internal/controlclient/**"
            - "**/internal/agent/**"
          deny:
            - pkg: github.com/bshlisky/tetragon-relay/internal/telemetry
              desc: the control path must not reach telemetry (architecture 10.2)
    exhaustive:
      default-signifies-exhaustive: false
    gosec:
      excludes:
        # G115: int/uint conversions. policy.Version (protobuf, 7.3) is a
        # JSON-decoded int in a size-bounded, schema-validated bundle; not an
        # attacker-controlled width overflow vector in this step.
        - G115
  exclusions:
    rules:
      # Test and generator code intentionally uses weak/deterministic
      # constructs (e.g. math-free test key generation, panics on
      # unexpected generation failure) that would be inappropriate in
      # production code.
      - path: _test\.go
        linters:
          - gosec
          - forcetypeassert
      - path: cmd/bundlesign-test/
        linters:
          - gosec
          - forcetypeassert
      # Vendored protoc-gen-go/-go-grpc/-go-json output (third_party/
      # tetragon/v1.8.0/api/v1/tetragon/README.md): copied verbatim from
      # upstream and never hand-edited, so this project's own style rules
      # do not apply to it.
      - path: third_party/tetragon/v1\.8\.0/api/
        linters:
          - revive
          - gocritic
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 fetches full history so buf breaking (step 1
          # review A12) can read PROTO_BASELINE's commit via
          # ".git#ref=<sha>"; a shallow checkout would not have it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt / goimports check
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './api/*' -not -path './third_party/tetragon/v1.8.0/api/*'))
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
          out=$(goimports -l $(find . -name '*.go' -not -path './vendor/*' -not -path './api/*' -not -path './third_party/tetragon/v1.8.0/api/*'))
          if [ -n "$out" ]; then
            echo "goimports needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # step-05a prompt C1/D1: internal/tpm's tests (and internal/agent's
      # tpmwiring tests, which build on them) need a real TPM 2.0
      # implementation, not a mock, to actually exercise the TPM command
      # flows this step adds. Installed here, before the race/coverage
      # steps below, so those steps' internal/tpm and internal/agent
      # runs are the real thing, not skipped (docs/decisions/0027-tpm-
      # library-and-software-tpm.md: swtpm chosen over the cgo-based
      # go-tpm-tools simulator).
      - name: Install swtpm (software TPM for internal/tpm's tests)
        run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: go mod verify
        run: make modverify

      - name: Vendor drift check
        run: make vendor-check

      - name: Verify vendored CRD hash
        run: make verify-crd

      - name: Verify vendored Tetragon API bindings hash
        run: make verify-tetragon-api

      - name: "Verify production relayd's symbol table has no testca/testenroll symbol (step-06a-e3-prompt.md C1)"
        run: make verify-no-test-symbols

      - name: Test with race detector and coverage
        run: go test -race -count=1 -cover ./...

      - name: Per-package coverage gate (internal/dsse, internal/strictjson, internal/trust, internal/verify, internal/policydoc, internal/guard >= 95%)
        run: make coverage

      - name: Per-package coverage gate (internal/tetra, internal/apply, internal/hostprobe, internal/agent >= 90%; step 3 Part E5)
        run: make coverage90

      - name: Per-package coverage gate (internal/tpm >= 90%, against the real swtpm; step-05a prompt D4)
        run: make coverage-tpm

      - name: "internal/tpm verbose test output (step-05a prompt D1: at least one CI job must exercise the real TPM command flows)"
        run: make tpm-test

      - name: Fuzz smoke (60s per target)
        run: make fuzz-short

      - name: Reproducible build check
        run: make verify-repro

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Regenerate proto and diff
        run: make proto

      - name: Proto breaking-change check
        run: make breaking

      - name: Create SBOM output directory
        run: mkdir -p dist

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

  # Step 3 prompt Part E3: integration tests against a REAL Tetragon v1.8.0,
  # downloaded from the official release tarball and run as root. The test
  # binary itself (go test) runs as the unprivileged "runner" user; only
  # starting/stopping the tetragon daemon uses sudo (see
  # docs/reports/step-03.md section 13 and 11 for the facts/citations this
  # job and internal/tetra/internal/apply's integration-tagged tests rely
  # on, and for why this job's own execution could not be verified from
  # this development environment, only authored and reviewed).
  integration:
    runs-on: ubuntu-24.04
    needs: ci
    env:
      TETRAGON_VERSION: v1.8.0
      # Pin the release tarball's sha256 (architecture doc 8.12 supply
      # chain policy: every fetched artifact is hash-pinned). This matches
      # the official tetragon-v1.8.0-amd64.tar.gz asset's published
      # .sha256sum file on the v1.8.0 GitHub release; update together with
      # any re-vendoring of the CRD/API bindings.
      TETRAGON_TARBALL_SHA256: "e88691c5f05a2a61aba58974a080603050b924c7f13ecc06f3d05172feb05f59"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download and verify Tetragon release tarball
        run: |
          set -euo pipefail
          url="https://github.com/cilium/tetragon/releases/download/${TETRAGON_VERSION}/tetragon-${TETRAGON_VERSION}-amd64.tar.gz"
          curl -fsSL -o tetragon.tar.gz "$url"
          echo "${TETRAGON_TARBALL_SHA256}  tetragon.tar.gz" | sha256sum -c -
          mkdir -p /tmp/tetragon-install
          tar -xzf tetragon.tar.gz -C /tmp/tetragon-install
          # The release tarball extracts into a versioned subdirectory
          # (tetragon-${TETRAGON_VERSION}-amd64/tetragon), not directly
          # into the target directory's root (tetragon.io/docs/
          # installation/package/'s own "tar -xvf ...; cd
          # tetragon-v1.8.0-amd64/" confirms this), so the binary's
          # containing directory must be located dynamically rather than
          # assumed to be /tmp/tetragon-install itself.
          tetragon_bin="$(find /tmp/tetragon-install -maxdepth 6 -type f -name tetragon | head -1)"
          if [ -z "${tetragon_bin}" ]; then
            echo "could not find the tetragon binary inside the extracted tarball" >&2
            find /tmp/tetragon-install >&2
            exit 1
          fi
          chmod +x "${tetragon_bin}"
          dirname "${tetragon_bin}" >> "$GITHUB_PATH"
          echo "TETRAGON_BIN=${tetragon_bin}" >> "$GITHUB_ENV"

      - name: Create relay-managed group and socket directories
        run: |
          sudo groupadd -f tetragon-relay
          sudo mkdir -p /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          # step-03a-review.md R3-2: internal/apply.PersistDir now only
          # ever writes inside the "relay" subdirectory itself (a staging
          # subdirectory nested inside it, then renames within that same
          # directory) — never into tetragon.tp.d, the parent, matching
          # the production unit's ReadWritePaths=.../relay (which does not
          # grant write access to tetragon.tp.d itself). Only "relay"
          # needs relay-group write access here; tetragon.tp.d stays
          # root-owned/read-only to the relay group, same as production.
          sudo chown root:tetragon-relay /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          sudo chmod 2770 /etc/tetragon/tetragon.tp.d/relay
          sudo usermod -a -G tetragon-relay "$(id -un)"

      - name: Record kernel version and capability probe output
        run: |
          uname -a
          GOOS=linux go build -o relay-probe ./cmd/relay-probe
          sudo ./relay-probe --report --tetragon-binary "${TETRAGON_BIN}" || true

      - name: Start Tetragon (root, transient unit) on the unix socket
        run: |
          # step-03a-review.md R3-1: Tetragon must run as a real systemd
          # unit (not a bare backgrounded process) so internal/tetra's
          # cgroup v2 membership check (peercgroup_linux.go) has a real
          # "system.slice/tetragon.service" cgroup to verify against —
          # the same unified-hierarchy path Config.UnitCgroupPath defaults
          # to, matching packaging/systemd/tetragon-relay.service's own
          # production unit's expected peer.
          #
          # The release tarball mirrors an FHS tree
          # (tetragon-v1.8.0-amd64/usr/local/{bin,lib}/...); its own
          # install.sh would copy usr/local/lib/tetragon's contents
          # (bpf_alignchecker.o and friends) to /var/lib/tetragon/, which
          # --bpf-lib defaults to. Since this job only extracted the
          # tarball rather than running install.sh, point --bpf-lib at the
          # extracted usr/local/lib/tetragon directory directly instead.
          bpf_lib_dir="$(dirname "${TETRAGON_BIN}")/../lib/tetragon/bpf"
          sudo systemd-run --unit=tetragon --collect \
            --property=Type=simple \
            "${TETRAGON_BIN}" \
            --server-address unix:///var/run/tetragon/tetragon.sock \
            --tracing-policy-dir /etc/tetragon/tetragon.tp.d \
            --bpf-lib "${bpf_lib_dir}"
          sleep 3
          # Fail fast and loudly if Tetragon did not actually start,
          # rather than letting the integration test suite fail later
          # with a confusing "connection refused".
          if ! sudo systemctl is-active --quiet tetragon.service; then
            echo "Tetragon did not start; log:" >&2
            sudo journalctl -u tetragon.service --no-pager >&2
            exit 1
          fi
          sudo chmod 660 /var/run/tetragon/tetragon.sock
          sudo chown root:tetragon-relay /var/run/tetragon/tetragon.sock

      - name: Run integration test suite (unprivileged, build tag "integration")
        run: |
          set -euo pipefail
          # go test compiles a fresh temp binary per invocation; build
          # real test binaries first (no setcap needed since R3-1: the
          # peer checks need no capability) and run them as the
          # unprivileged tetragon-relay group member.
          go test -tags integration -race -count=1 -c -o /tmp/tetra.itest ./internal/tetra
          go test -tags integration -race -count=1 -c -o /tmp/apply.itest ./internal/apply
          # step-04c.md Part E7: internal/agent's own integration test
          # (apply a bundle, simulate an agent restart via a store
          # close/reopen + Startup, confirm epoch/LKG persistence and
          # replay rejection) against the SAME Tetragon instance this
          # job already started. Built and run alongside the existing
          # two, before apply's own final "nothing left loaded" check
          # below, so that check also covers whatever this suite loaded.
          go test -tags integration -race -count=1 -c -o /tmp/agent.itest ./internal/agent
          # TestAllowlist_NoOtherRPCsReferenced (internal/tetra) reads its
          # own package's .go files via a relative path, so each compiled
          # test binary must run with its source package directory as the
          # working directory, not wherever it happens to be invoked from.
          #
          # SO_PEERSEC (peer SELinux domain) cannot be exercised for real
          # here: GitHub-hosted ubuntu-24.04 runners have SELinux
          # disabled, so internal/tetra's AllowSELinuxDisabled=true path
          # (dialIntegration sets it explicitly, since the zero value is
          # now fail-closed per step-03b-review.md R3B-1) is what runs;
          # that check is only exercised against a real SELinux-enabled
          # peer by scripts/e2e-rhel9.sh on a real RHEL 9 host.
          sg tetragon-relay -c 'cd internal/tetra && /tmp/tetra.itest -test.v && cd ../apply && /tmp/apply.itest -test.v && cd ../agent && /tmp/agent.itest -test.v'

      - name: Verify the admin-path test's PID scoping actually held (step-03a-review.md R3-E3)
        if: always()
        run: |
          # TestIntegration_RollbackOnAdminPathKill's policy scopes its
          # Sigkill action to that test's own pid tree via matchPIDs (not
          # by path, since it must target the real, compiled-in
          # "/usr/bin/bash" admin-path entry — see ADR 0020 and the
          # test's own doc comment). This runs a real "/usr/bin/bash"
          # invocation from a brand new, unrelated process tree (this
          # workflow step, not any go test process) and requires it to
          # exit 0 — proving the policy did not (and, since Tetragon has
          # since been asked to roll it back, does not still) affect
          # anything outside the test that loaded it.
          /usr/bin/bash -c '/usr/bin/true; /usr/bin/true'

      - name: Verify no tracing policies were left loaded (step-03a-review.md R3-E3 fix F2)
        if: always()
        run: |
          sg tetragon-relay -c 'cd internal/apply && /tmp/apply.itest -test.v -test.run "^TestZZZFinalCheck_NoTracingPoliciesLeftLoaded$"'

      - name: Stop Tetragon
        if: always()
        run: sudo systemctl stop tetragon.service || true

  # docs/prompts/step-06a-e3-prompt.md: relayd as a real process under the
  # production systemd unit's own sandbox settings (reproduced verbatim by
  # scripts/e3-run.sh, parsed directly from packaging/systemd/
  # tetragon-relay.service), with swtpm at /dev/tpmrm0 (vtpm proxy) and the test
  # CA (testca build tag) for identity, against a real Tetragon and
  # cmd/e3controller. See docs/reports/step-06a.md section 9/14 for the
  # full design and per-scenario evidence.
  e3:
    runs-on: ubuntu-24.04
    needs: [ci, integration]
    env:
      TETRAGON_VERSION: v1.8.0
      TETRAGON_TARBALL_SHA256: "e88691c5f05a2a61aba58974a080603050b924c7f13ecc06f3d05172feb05f59"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install swtpm
        run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools

      - name: Download and verify Tetragon release tarball
        run: |
          set -euo pipefail
          url="https://github.com/cilium/tetragon/releases/download/${TETRAGON_VERSION}/tetragon-${TETRAGON_VERSION}-amd64.tar.gz"
          curl -fsSL -o tetragon.tar.gz "$url"
          echo "${TETRAGON_TARBALL_SHA256}  tetragon.tar.gz" | sha256sum -c -
          mkdir -p /tmp/tetragon-install
          tar -xzf tetragon.tar.gz -C /tmp/tetragon-install
          tetragon_bin="$(find /tmp/tetragon-install -maxdepth 6 -type f -name tetragon | head -1)"
          if [ -z "${tetragon_bin}" ]; then
            echo "could not find the tetragon binary inside the extracted tarball" >&2
            exit 1
          fi
          chmod +x "${tetragon_bin}"
          # /usr/local/bin/tetragon: the exact path the real unit's
          # host-facts ExecStartPre hashes (--tetragon-binary), and the
          # binary the Tetragon unit below runs, so the hash is of the
          # running daemon.
          sudo install -o root -g root -m 0755 "${tetragon_bin}" /usr/local/bin/tetragon
          echo "TETRAGON_BIN=/usr/local/bin/tetragon" >> "$GITHUB_ENV"
          echo "TETRAGON_BPF_LIB=$(dirname "${tetragon_bin}")/../lib/tetragon/bpf" >> "$GITHUB_ENV"

      - name: Create relay-managed group and socket directories
        run: |
          sudo groupadd -f tetragon-relay
          sudo mkdir -p /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          sudo chown root:tetragon-relay /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          sudo chmod 2770 /etc/tetragon/tetragon.tp.d/relay
          sudo usermod -a -G tetragon-relay "$(id -un)"

      - name: Start Tetragon (root, from a unit file) on the unix socket
        run: |
          # A real unit file, not a transient systemd-run unit: the relay
          # unit's BindsTo=/After=tetragon.service name a packaged unit in
          # production, and systemd-analyze verify cannot resolve a
          # transient one (run 45923100259: "Unit tetragon.service not
          # found"). This file is CI scaffolding for Tetragon itself; the
          # relay unit is untouched.
          sudo tee /etc/systemd/system/tetragon.service >/dev/null <<EOF
          [Unit]
          Description=Tetragon (E3 CI)

          [Service]
          Type=simple
          ExecStart=${TETRAGON_BIN} --server-address unix:///var/run/tetragon/tetragon.sock --tracing-policy-dir /etc/tetragon/tetragon.tp.d --bpf-lib ${TETRAGON_BPF_LIB}
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start tetragon.service
          sleep 3
          if ! sudo systemctl is-active --quiet tetragon.service; then
            echo "Tetragon did not start; log:" >&2
            sudo journalctl -u tetragon.service --no-pager >&2
            exit 1
          fi
          sudo chmod 660 /var/run/tetragon/tetragon.sock
          sudo chown root:tetragon-relay /var/run/tetragon/tetragon.sock

      - name: Build relayd (production, no tags) and relay-probe
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/libexec/tetragon-relay
          # The production binary goes at the real unit's own ExecStart
          # path, so S1/S2 run the unit with no drop-in at all.
          go build -o /tmp/relayd ./cmd/relayd
          sudo cp /tmp/relayd /usr/libexec/tetragon-relay/relayd
          sudo chmod 0755 /usr/libexec/tetragon-relay/relayd
          go build -o /tmp/relay-probe ./cmd/relay-probe
          sudo cp /tmp/relay-probe /usr/libexec/tetragon-relay/relay-probe
          sudo chmod 0755 /usr/libexec/tetragon-relay/relay-probe

      - name: "Build relayd (E3: -tags testca) and the E3 harness tools"
        run: |
          set -euo pipefail
          go build -tags testca -o /tmp/relayd-e3 ./cmd/relayd
          sudo cp /tmp/relayd-e3 /usr/libexec/tetragon-relay/relayd-e3
          sudo chmod 0755 /usr/libexec/tetragon-relay/relayd-e3

          # /opt/e3bin, not $GITHUB_WORKSPACE/e3bin: cmd/testenroll must
          # run as the tetragon-relay user (sudo -u tetragon-relay), which
          # cannot traverse into /home/runner/work/... at all (confirmed
          # by the first E3 run, 45809746645: "sudo: unable to execute
          # .../e3bin/testenroll: Permission denied") -- the same /home
          # access problem relayd's own binaries have under ProtectHome,
          # just hitting plain directory permissions instead of a systemd
          # sandbox this time.
          sudo mkdir -p /opt/e3bin
          go build -tags testca -o /tmp/testenroll ./cmd/testenroll
          go build -tags e3 -o /tmp/e3controller ./cmd/e3controller
          go build -tags e3 -o /tmp/e3tetra ./cmd/e3tetra
          go build -tags e3 -o /tmp/e3root ./cmd/e3root
          go build -tags testtools -o /tmp/bundlesign-test ./cmd/bundlesign-test
          sudo cp /tmp/testenroll /tmp/e3controller /tmp/e3tetra /tmp/e3root /tmp/bundlesign-test /opt/e3bin/
          sudo chmod 0755 /opt/e3bin/testenroll /opt/e3bin/e3controller /opt/e3bin/e3tetra /opt/e3bin/e3root /opt/e3bin/bundlesign-test
          echo "BIN_DIR=/opt/e3bin" >> "$GITHUB_ENV"

      - name: Verify the production unit file (systemd-analyze verify)
        # docs/reviews/step-06a-e3-decisions.md D4: any warning or error
        # fails the job. Runs here, after every binary the unit's
        # ExecStartPre/ExecStart lines name is installed at its real
        # path and tetragon.service (BindsTo=) exists, so verify's
        # executable and dependency checks see a complete host.
        run: |
          set -uo pipefail
          # The step shell runs with -e; capture rc explicitly so the
          # output is always printed (run 45873245634 exited silently).
          rc=0
          # SYSTEMD_LOG_TARGET=console: run 45876885071 failed with rc=1
          # and no output, because systemd tools may log to the journal
          # rather than stderr. --man=no: Documentation= is not checked.
          out="$(sudo env SYSTEMD_LOG_TARGET=console SYSTEMD_LOG_LEVEL=notice systemd-analyze verify --man=no "${GITHUB_WORKSPACE}/packaging/systemd/tetragon-relay.service" 2>&1)" || rc=$?
          if [ "${rc}" -ne 0 ] && [ -z "${out}" ]; then
            sudo journalctl -t systemd-analyze --since "-5min" --no-pager || true
          fi
          printf '%s\n' "${out}"
          if [ "${rc}" -ne 0 ] || [ -n "${out}" ]; then
            echo "systemd-analyze verify reported problems (rc=${rc})" >&2
            exit 1
          fi

      - name: Run E3 scenarios (S1-S12)
        run: |
          # sg tetragon-relay (not just the usermod -a -G above): a group
          # added to this user mid-session only takes effect in a freshly
          # spawned process with that supplementary group active, the
          # same reason the "integration" job's own test-binary step uses
          # sg -- e3tetra (ListTracingPolicies/AddTracingPolicy against
          # Tetragon's root:tetragon-relay 0660 socket) needs it too.
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export BIN_DIR="${BIN_DIR}"
          export TETRAGON_BIN="${TETRAGON_BIN}"
          sg tetragon-relay -c 'bash scripts/e3-run.sh'

      - name: Dump relayd unit logs (always, for debugging)
        if: always()
        run: |
          sudo journalctl -u tetragon-relay --no-pager 2>&1 || true

      - name: Stop Tetragon
        if: always()
        run: sudo systemctl stop tetragon.service || true

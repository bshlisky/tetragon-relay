name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 fetches full history so buf breaking (step 1
          # review A12) can read PROTO_BASELINE's commit via
          # ".git#ref=<sha>"; a shallow checkout would not have it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt / goimports check
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './api/*' -not -path './third_party/tetragon/v1.8.0/api/*'))
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
          out=$(goimports -l $(find . -name '*.go' -not -path './vendor/*' -not -path './api/*' -not -path './third_party/tetragon/v1.8.0/api/*'))
          if [ -n "$out" ]; then
            echo "goimports needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: go mod verify
        run: make modverify

      - name: Vendor drift check
        run: make vendor-check

      - name: Verify vendored CRD hash
        run: make verify-crd

      - name: Verify vendored Tetragon API bindings hash
        run: make verify-tetragon-api

      - name: Test with race detector and coverage
        run: go test -race -count=1 -cover ./...

      - name: Per-package coverage gate (internal/dsse, internal/strictjson, internal/trust, internal/verify, internal/policydoc, internal/guard >= 95%)
        run: make coverage

      - name: Per-package coverage gate (internal/tetra, internal/apply, internal/hostprobe >= 90%; step 3 Part E5)
        run: make coverage90

      - name: Fuzz smoke (60s per target)
        run: make fuzz-short

      - name: Reproducible build check
        run: make verify-repro

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Regenerate proto and diff
        run: make proto

      - name: Proto breaking-change check
        run: make breaking

      - name: Create SBOM output directory
        run: mkdir -p dist

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

  # Step 3 prompt Part E3: integration tests against a REAL Tetragon v1.8.0,
  # downloaded from the official release tarball and run as root. The test
  # binary itself (go test) runs as the unprivileged "runner" user; only
  # starting/stopping the tetragon daemon uses sudo (see
  # docs/reports/step-03.md section 13 and 11 for the facts/citations this
  # job and internal/tetra/internal/apply's integration-tagged tests rely
  # on, and for why this job's own execution could not be verified from
  # this development environment, only authored and reviewed).
  integration:
    runs-on: ubuntu-24.04
    needs: ci
    env:
      TETRAGON_VERSION: v1.8.0
      # Pin the release tarball's sha256 (architecture doc 8.12 supply
      # chain policy: every fetched artifact is hash-pinned). This matches
      # the official tetragon-v1.8.0-amd64.tar.gz asset's published
      # .sha256sum file on the v1.8.0 GitHub release; update together with
      # any re-vendoring of the CRD/API bindings.
      TETRAGON_TARBALL_SHA256: "e88691c5f05a2a61aba58974a080603050b924c7f13ecc06f3d05172feb05f59"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download and verify Tetragon release tarball
        run: |
          set -euo pipefail
          url="https://github.com/cilium/tetragon/releases/download/${TETRAGON_VERSION}/tetragon-${TETRAGON_VERSION}-amd64.tar.gz"
          curl -fsSL -o tetragon.tar.gz "$url"
          echo "${TETRAGON_TARBALL_SHA256}  tetragon.tar.gz" | sha256sum -c -
          mkdir -p /tmp/tetragon-install
          tar -xzf tetragon.tar.gz -C /tmp/tetragon-install
          # The release tarball extracts into a versioned subdirectory
          # (tetragon-${TETRAGON_VERSION}-amd64/tetragon), not directly
          # into the target directory's root (tetragon.io/docs/
          # installation/package/'s own "tar -xvf ...; cd
          # tetragon-v1.8.0-amd64/" confirms this), so the binary's
          # containing directory must be located dynamically rather than
          # assumed to be /tmp/tetragon-install itself.
          tetragon_bin="$(find /tmp/tetragon-install -maxdepth 6 -type f -name tetragon | head -1)"
          if [ -z "${tetragon_bin}" ]; then
            echo "could not find the tetragon binary inside the extracted tarball" >&2
            find /tmp/tetragon-install >&2
            exit 1
          fi
          chmod +x "${tetragon_bin}"
          dirname "${tetragon_bin}" >> "$GITHUB_PATH"
          echo "TETRAGON_BIN=${tetragon_bin}" >> "$GITHUB_ENV"

      - name: Create relay-managed group and socket directories
        run: |
          sudo groupadd -f tetragon-relay
          sudo mkdir -p /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          # step-03a-review.md R3-2: internal/apply.PersistDir now only
          # ever writes inside the "relay" subdirectory itself (a staging
          # subdirectory nested inside it, then renames within that same
          # directory) — never into tetragon.tp.d, the parent, matching
          # the production unit's ReadWritePaths=.../relay (which does not
          # grant write access to tetragon.tp.d itself). Only "relay"
          # needs relay-group write access here; tetragon.tp.d stays
          # root-owned/read-only to the relay group, same as production.
          sudo chown root:tetragon-relay /var/run/tetragon /etc/tetragon/tetragon.tp.d/relay
          sudo chmod 2770 /etc/tetragon/tetragon.tp.d/relay
          sudo usermod -a -G tetragon-relay "$(id -un)"

      - name: Record kernel version and capability probe output
        run: |
          uname -a
          GOOS=linux go build -o relay-probe ./cmd/relay-probe
          sudo ./relay-probe --report --tetragon-binary "${TETRAGON_BIN}" || true

      - name: Start Tetragon (root, transient unit) on the unix socket
        run: |
          # step-03a-review.md R3-1: Tetragon must run as a real systemd
          # unit (not a bare backgrounded process) so internal/tetra's
          # cgroup v2 membership check (peercgroup_linux.go) has a real
          # "system.slice/tetragon.service" cgroup to verify against —
          # the same unified-hierarchy path Config.UnitCgroupPath defaults
          # to, matching packaging/systemd/tetragon-relay.service's own
          # production unit's expected peer.
          #
          # The release tarball mirrors an FHS tree
          # (tetragon-v1.8.0-amd64/usr/local/{bin,lib}/...); its own
          # install.sh would copy usr/local/lib/tetragon's contents
          # (bpf_alignchecker.o and friends) to /var/lib/tetragon/, which
          # --bpf-lib defaults to. Since this job only extracted the
          # tarball rather than running install.sh, point --bpf-lib at the
          # extracted usr/local/lib/tetragon directory directly instead.
          bpf_lib_dir="$(dirname "${TETRAGON_BIN}")/../lib/tetragon/bpf"
          sudo systemd-run --unit=tetragon --collect \
            --property=Type=simple \
            "${TETRAGON_BIN}" \
            --server-address unix:///var/run/tetragon/tetragon.sock \
            --tracing-policy-dir /etc/tetragon/tetragon.tp.d \
            --bpf-lib "${bpf_lib_dir}"
          sleep 3
          # Fail fast and loudly if Tetragon did not actually start,
          # rather than letting the integration test suite fail later
          # with a confusing "connection refused".
          if ! sudo systemctl is-active --quiet tetragon.service; then
            echo "Tetragon did not start; log:" >&2
            sudo journalctl -u tetragon.service --no-pager >&2
            exit 1
          fi
          sudo chmod 660 /var/run/tetragon/tetragon.sock
          sudo chown root:tetragon-relay /var/run/tetragon/tetragon.sock

      - name: DIAGNOSTIC - capture tetra getevents (unfiltered)
        run: |
          tetra_bin="$(dirname "${TETRAGON_BIN}")/tetra"
          nohup sudo "${tetra_bin}" getevents -o compact --server-address unix:///var/run/tetragon/tetragon.sock > /tmp/tetra-getevents.log 2>&1 &
          echo $! > /tmp/tetra-getevents.pid
          sleep 1

      - name: Run integration test suite (unprivileged, build tag "integration")
        run: |
          set -euo pipefail
          go test -tags integration -race -count=1 -c -o /tmp/apply.itest ./internal/apply
          sg tetragon-relay -c 'cd internal/apply && /tmp/apply.itest -test.v -test.run "TestDiagnoseE1_AttachLatency_NoSelectors|TestDiagnoseE2_CallerSemantics_CopiedBash"'

      - name: DIAGNOSTIC - stop tetra getevents and show log
        if: always()
        run: |
          sudo kill "$(cat /tmp/tetra-getevents.pid)" 2>/dev/null || true
          sleep 1
          sudo chmod 644 /tmp/tetra-getevents.log || true
          cat /tmp/tetra-getevents.log || true

      - name: DIAGNOSTIC - upload tetra getevents log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetra-getevents-log
          path: /tmp/tetra-getevents.log

      - name: Stop Tetragon
        if: always()
        run: sudo systemctl stop tetragon.service || true
